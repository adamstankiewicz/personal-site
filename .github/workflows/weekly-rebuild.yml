name: Weekly stats refresh

# The GitHub PR counts in the footer are baked at build time, so they
# only refresh when a deploy runs. This triggers a Netlify rebuild once
# a week so the numbers stay current between real ships.
#
# Requires the NETLIFY_BUILD_HOOK_URL repository secret: create a build
# hook under Netlify → Site configuration → Build & deploy → Build
# hooks, then `gh secret set NETLIFY_BUILD_HOOK_URL`.

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Netlify build hook
        env:
          HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::error::NETLIFY_BUILD_HOOK_URL secret is not set"
            exit 1
          fi
          curl -fsS -X POST -d '{}' "$HOOK_URL"
