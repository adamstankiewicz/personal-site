name: Monthly floor ratchet

# data/gh-stats-floor.json is the committed high-water mark for the
# footer's GitHub PR counts — insurance against a token losing
# private-org visibility later. It only advances when a bake runs
# locally and gets committed, which assumes regular shipping. This
# bakes once a month and lands any ratchet through a real PR (no
# direct pushes to master), merged automatically since it can only
# touch the one data file.
#
# Requires the GH_STATS_TOKEN repository secret (same PAT as Netlify's
# build env var): `gh secret set GH_STATS_TOKEN`.

on:
  schedule:
    - cron: "0 10 1 * *" # 1st of the month, 10:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bake fresh stats
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: |
          if [ -z "$GH_STATS_TOKEN" ]; then
            echo "::error::GH_STATS_TOKEN secret is not set"
            exit 1
          fi
          node scripts/build-gh-stats.mjs
      - name: PR and merge the ratchet, if any
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/gh-stats-floor.json; then
            echo "Floor unchanged; nothing to do."
            exit 0
          fi
          branch="chore/floor-ratchet-$(date +%Y-%m)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/gh-stats-floor.json
          git commit -m "chore: ratchet gh-stats floor"
          git push -u origin "$branch"
          gh pr create \
            --title "Ratchet gh-stats floor ($(date +%B\ %Y))" \
            --body "Automated monthly high-water-mark bump for the footer's baked GitHub PR counts. Touches only data/gh-stats-floor.json."
          gh pr merge --squash --delete-branch
