<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <style>
    .bg { fill: #ffffff; }
    .line { stroke: #e7e7e9; }
    .dot { fill: #1435e5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d0e11; }
      .line { stroke: #292a30; }
      .dot { fill: #8b9dff; }
    }
  </style>
  <rect class="bg" width="128" height="128" rx="28"/>
  <rect class="line" x="2" y="2" width="124" height="124" rx="26" fill="none" stroke-width="4"/>
  <circle class="dot" cx="64" cy="64" r="26"/>
</svg>
